<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Kokeの楽曲一覧。YouTube・niconico・SoundCloudで視聴できます。">
    <title>楽曲 — Koke</title>
    <link rel="icon" href="./assets/favicon.png?v=20261025" type="image/png">
    <link rel="stylesheet" href="./style.css?v=20261025-jacket-shadow-soft">


    <script src="./content.js?v=20261025-publish-dates" defer></script>
    <script src="./track-sort.js?v=20261023-track-sort" defer></script>
    <script src="./track-library.js?v=20261024-preview-field" defer></script>
    <script src="./card-reveal.js?v=20261024-no-transition" defer></script>
    <script src="./script.js?v=20261024-news-link" defer></script>
    <script src="./background.js" defer></script>
    <script src="./lighting.js?v=20261024-flow-subtle" defer></script>
      <link rel="stylesheet" href="./footer.css?v=20261024-footer1">
    <script src="./footer.js?v=20261024-no-commission" defer></script>
    <link rel="stylesheet" href="./interactions.css?v=20261024-stable-hover">
  </head>
  <body id="page-top" tabindex="-1" class="visual-only music-page">
    <div class="background-architecture" aria-hidden="true"><img src="./assets/architecture.svg" alt="" decoding="async"></div>
    <canvas id="generative-art" aria-hidden="true"></canvas>
    <canvas id="lighting-art" aria-hidden="true"></canvas>
    <a class="skip-link" href="#main">コンテンツへ移動</a>
    <header class="site-header">
      <nav class="header-pages" aria-label="ページナビゲーション">
        <a href="./index.html#home">ホーム</a>
        <a href="./music.html" aria-current="page">楽曲</a>

        <a href="./terms.html">利用規約</a>
        <a href="./articles.html">記事</a>
      </nav>
      <nav class="header-socials" aria-label="SNSリンク">
        <button class="social-icon" data-social="soundcloud" aria-label="SoundCloud（新しいタブで開く）" title="SoundCloud"><img src="./assets/brands/soundcloud.webp" alt="" aria-hidden="true" width="24" height="24"></button>
        <button class="social-icon" data-social="youtube" aria-label="YouTube（新しいタブで開く）" title="YouTube"><img src="./assets/brands/youtube.png" alt="" aria-hidden="true" width="24" height="24"></button>
        <button class="social-icon" data-social="x" aria-label="X（新しいタブで開く）" title="X"><img src="./assets/brands/x.png" alt="" aria-hidden="true" width="24" height="24"></button>
        <button class="social-icon" data-social="niconico" aria-label="niconico（新しいタブで開く）" title="niconico"><img src="./assets/brands/niconico.png" alt="" aria-hidden="true" width="24" height="24"></button>
      </nav>
    </header>
    <button class="menu-toggle" id="menu-toggle" aria-label="メニューを開く" aria-controls="site-menu" aria-expanded="false" aria-haspopup="dialog">
      <img class="menu-icon-open" src="./assets/icons/lucide/menu.svg" alt="" aria-hidden="true" width="24" height="24">
      <img class="menu-icon-close" src="./assets/icons/lucide/x.svg" alt="" aria-hidden="true" width="24" height="24">
    </button>
    <dialog class="site-menu" id="site-menu" aria-labelledby="menu-title">
      <div class="menu-panel">
        <h2 id="menu-title">メニュー</h2>
        <nav class="menu-navigation" aria-label="ページナビゲーション">
        <a href="./index.html#home">ホーム</a>
        <a href="./music.html" aria-current="page">楽曲</a>

        <a href="./terms.html">利用規約</a>
        <a href="./articles.html">記事</a>
      </nav>
      </div>
    </dialog>
    <nav class="page-index" aria-label="ページ内の項目">
      <a href="#music" aria-current="location">楽曲</a>
    </nav>
    <main id="main">
      <section id="music" class="music-showcase" aria-labelledby="music-title">
        <div class="music-inner">
          <div class="music-heading-row">
            <h1 id="music-title">楽曲</h1>
          </div>
          <div class="music-tools" role="search" aria-label="楽曲を探す">
            <div class="music-search-row">
              <label class="music-search"><img src="./assets/icons/lucide/search.svg" width="18" height="18" alt="" aria-hidden="true"><span class="sr-only">曲名・作曲者・歌唱者・タグを検索</span><input id="track-search" type="search" placeholder="楽曲を検索" autocomplete="off"></label>
              <div class="music-order-controls">
                <button class="music-sort-toggle" id="track-sort" type="button" aria-controls="track-grid" aria-label="新しい順。押すと古い順に切り替え">
                  <span class="sort-label">新しい順</span><span class="sort-chevron" aria-hidden="true">▾</span>
                </button>
                <div class="tag-menu" id="tag-menu">
                  <button type="button" class="tag-menu-toggle" id="tag-menu-toggle" aria-label="タグで絞り込む" aria-expanded="false" aria-controls="tag-panel" title="タグで絞り込む">
                    <img src="./assets/icons/lucide/list-filter.svg" width="20" height="20" alt="" aria-hidden="true">
                    <span id="tag-selection-count" class="tag-selection-count" hidden></span>
                  </button>
                  <div class="tag-panel" id="tag-panel" hidden>
                    <p class="tag-panel-title">絞り込み</p>
                    <div class="tag-filters" id="track-tags" role="group" aria-label="タグで絞り込む"></div>
                  </div>
                </div>
              </div>
            </div>
            <button type="button" id="track-reset" class="filter-reset" hidden>条件をクリア</button>
          </div>
          <p id="music-sort-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
          <div id="track-grid" class="song-list"></div>
          <p id="music-empty" class="music-empty">掲載する楽曲を準備しています。</p>
        </div>
      </section>
    </main>
    <footer class="site-footer common-footer" data-site-footer aria-label="フッター"></footer>
  </body>
</html>
